{
  "version": 1,
  "backend": {
    "phases": {
      "build": {
        "commands": [
          ": \"${AWS_APP_ID:?Amplify must provide AWS_APP_ID}\"",
          ": \"${AWS_BRANCH:?Amplify must provide AWS_BRANCH}\"",
          ": \"${AWS_COMMIT_ID:?Amplify must provide AWS_COMMIT_ID}\"",
          ": \"${AWS_REGION:?Amplify must provide AWS_REGION}\"",
          ": \"${AWS_DEFAULT_REGION:?Amplify must provide AWS_DEFAULT_REGION}\"",
          ": \"${FSK_EXPECTED_AWS_ACCOUNT_ID:?set the approved AWS account}\"",
          ": \"${FSK_EXPECTED_AWS_REGION:?set the approved AWS region}\"",
          ": \"${FSK_EXPECTED_AMPLIFY_APP_ID:?set the approved FSK Amplify App ID}\"",
          ": \"${FSK_EXPECTED_AMPLIFY_BRANCH:?set the approved FSK branch}\"",
          ": \"${FSK_EXPECTED_DEPLOY_COMMIT:?set the approved 40-character commit}\"",
          "test \"$FSK_EXPECTED_AWS_ACCOUNT_ID\" = \"444083008754\"",
          "test \"$FSK_EXPECTED_AWS_REGION\" = \"ap-northeast-1\"",
          "test \"$AWS_APP_ID\" = \"$FSK_EXPECTED_AMPLIFY_APP_ID\"",
          "test \"$AWS_BRANCH\" = \"$FSK_EXPECTED_AMPLIFY_BRANCH\"",
          "test \"$AWS_COMMIT_ID\" = \"$FSK_EXPECTED_DEPLOY_COMMIT\"",
          "test \"$AWS_REGION\" = \"$FSK_EXPECTED_AWS_REGION\"",
          "test \"$AWS_DEFAULT_REGION\" = \"$FSK_EXPECTED_AWS_REGION\"",
          "test \"${#AWS_COMMIT_ID}\" -eq 40",
          "case \"$AWS_COMMIT_ID\" in *[!0-9a-f]*|'') exit 2 ;; esac",
          "test \"$(aws sts get-caller-identity --query Account --output text)\" = \"$FSK_EXPECTED_AWS_ACCOUNT_ID\"",
          "corepack enable",
          "corepack prepare pnpm@9.15.0 --activate",
          "pnpm install --frozen-lockfile",
          "CI=1 pnpm exec ampx pipeline-deploy --branch \"$FSK_EXPECTED_AMPLIFY_BRANCH\" --app-id \"$FSK_EXPECTED_AMPLIFY_APP_ID\" --outputs-out-dir apps/web/public",
          "test -s apps/web/public/amplify_outputs.json",
          "git check-ignore -q apps/web/public/amplify_outputs.json",
          "test -z \"$(git ls-files -- apps/web/public/amplify_outputs.json)\""
        ]
      }
    }
  },
  "frontend": {
    "phases": {
      "build": {
        "commands": [
          "pnpm run check:all",
          "pnpm run build:web"
        ]
      }
    },
    "artifacts": {
      "baseDirectory": "apps/web/dist",
      "files": ["**/*"]
    },
    "cache": {
      "paths": ["node_modules/**/*", ".pnpm-store/**/*"]
    }
  }
}
